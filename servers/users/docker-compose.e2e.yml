name: netflix-users-e2e

# Banco efêmero: os dados ficam em tmpfs (memória) e somem quando o container
# para, então cada execução da suíte começa do zero.
services:
  postgres:
    container_name: netflix_users_postgres_e2e
    image: 'postgres:18.0-alpine3.22'
    ports:
      - '127.0.0.1:5462:5432'
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
      POSTGRES_DB: netflix_users_e2e
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 15
