name: netflix-users-dev

services:
  postgres:
    container_name: netflix_users_postgres_dev
    image: 'postgres:18.0-alpine3.22'
    ports:
      - '127.0.0.1:${DB_PORT:?"defina no servers/users/.env (veja o .env.example)"}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:?"defina no servers/users/.env (veja o .env.example)"}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?"defina no servers/users/.env (veja o .env.example)"}
      POSTGRES_DB: ${DB_NAME:?"defina no servers/users/.env (veja o .env.example)"}
    volumes:
      - 'postgres_data:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
