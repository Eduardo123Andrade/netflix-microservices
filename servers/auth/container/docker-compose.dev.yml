name: netflix-auth-service-dev
services:
  postgres:
    container_name: netflix_auth_postgres_dev
    image: 'postgres:18.0-alpine3.22'
    
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?"defina no servers/auth/.env (veja o .env.example)"}:5432'

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?"defina no servers/auth/.env (veja o .env.example)"}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?"defina no servers/auth/.env (veja o .env.example)"}
      POSTGRES_DB: ${POSTGRES_DB:?"defina no servers/auth/.env (veja o .env.example)"}

    volumes:
      - 'postgres_data:/var/lib/postgresql'
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  postgres_data: