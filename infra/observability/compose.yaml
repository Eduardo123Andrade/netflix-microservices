services:
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-s",
          "-o",
          "/dev/null",
          "http://localhost:3000/api/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - netflix_services
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning:ro
      - ./grafana/dashboards/:/etc/grafana/dashboards:ro

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - netflix_services
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/local-config.yaml"
      - "-reporting.enabled=false"
    volumes:
      - loki_data:/loki
    networks:
      - netflix_services

  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
    restart: unless-stopped
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - netflix_services
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  netflix_services:
    name: netflix_services

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  alloy_data:
